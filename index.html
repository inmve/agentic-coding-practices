        };
    }

}

const STORAGE_KEY = "reference-answers-v1";

try {
    myAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
} catch (e) {
    myAnswers = {};

function saveAnswers() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(myAnswers));
    } catch (e) {}
}

function text(field) {
    if (field?.[lang]) return {
        value: field[lang],
        fallback: false
    };
    return {
        value: field?.[lang === "en" ? "ru" : "en"] || "",
        fallback: true
    };
}

function escapeHtml(raw) {
    return String(raw).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function entryDate(entry) {
    if (entry.firstAppeared?.date) return new Date(entry.firstAppeared.date);
    if (entry.seededFrom === "pre-llm") return null;
    const dates = (entry.sources || []).filter(s => s.published && s.role !== "relevance").map(s => s.published).sort();
    return dates.length ? new Date(dates[0]) : null;
}

function dateKey(entry) {
    const date = entryDate(entry);
    return date ? date.toISOString().slice(0, 10) : "";
}

function isAskable() {
    return false;
}

function formatDate(firstAppeared) {
    if (!firstAppeared?.date || !firstAppeared.verified) return "";
    const [year, month, day] = firstAppeared.date.split("-").map(Number);
    const monthName = UI[lang].months[month - 1];
    if (firstAppeared.precision === "day") return `${day} ${monthName} ${year}`;
    if (firstAppeared.precision === "month") return `${monthName} ${year}`;
    return (firstAppeared.note || "").toLowerCase().includes("approx") ? `~${year}` : String(year);
}

function isPreLlm(entry) {
    const date = entryDate(entry);
    return date && date < new Date(data.meta.llmEraStart);
}

function answerCounts(entryId) {
    let yes = 0, no = 0;
    for (const answer of demoAnswers) {
        if (answer.entry !== entryId) continue;
        answer.useful ? yes++ : no++;
    }
    const mine = myAnswers[entryId];
    if (mine && mine.useful !== null) mine.useful ? yes++ : no++;
    return {
        yes: yes,
        no: no
    };
}

function railHtml(counts, className) {
    const enough = counts.yes + counts.no >= data.meta.minAnswersForBar;
    return `<div class="${className}" ${enough && className === "rail" ? `title="${UI[lang].railTitle(counts.yes, counts.no)}"` : ""}>` + (enough ? `<div class="yes" style="flex:${counts.yes}"></div><div class="no" style="flex:${counts.no}"></div>` : "") + `</div>`;
}

function footnote(entry, n, label) {
    return `<sup><button data-entry="${entry.id}" data-n="${n}">[${label}]</button></sup>`;
}

function whyLinks(entry) {
    const numbers = entry.sources.filter(s => s.role === "why" && s.quote).map(s => s.n);
    return numbers.length ? ` <sup><button class="why" data-entry="${entry.id}" data-n="${numbers.join(",")}">${UI[lang].why}</button></sup>` : "";
}

function renderDefinition(entry) {

    const notes = cited.map((source, i) => footnote(entry, String(source.n), i + 1)).join("");
    const html = escapeHtml(value.replace(/(\s*\[\d+\])+/g, "")).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*([^*]+)\*/g, "<i>$1</i>") + (notes ? " " + notes : "");
    return fallback ? `<span class="fallback">${html}</span>` : html;
}

function initPlayer(pop, inModal = false) {
    const spec = motion[pop.dataset.motion];
    pop.innerHTML = spec.svg;
    pop.dataset.durations = spec.durations;
    pop.dataset.poster = spec.poster;
    const durations = pop.dataset.durations.split(" ").map(Number), poster = Number(pop.dataset.poster || durations.length - 1);
    const total = durations.reduce((a, b) => a + b, 0);
    const svg = pop.querySelector("svg");
    const parts = [ ...svg.querySelectorAll("[data-on]") ], movers = [ ...svg.querySelectorAll("[data-t]") ];
    const toned = [ ...svg.querySelectorAll("[data-hot],[data-good]") ];
    svg.querySelectorAll(".draw").forEach(p => p.style.setProperty("--len", Math.ceil(p.getTotalLength())));
    const moves = movers.map(el => el.dataset.t.split(";").map(s => {
        const k = s.indexOf(":");
        return [ Number(s.slice(0, k)), s.slice(k + 1) ];
    }));
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "0:" + String(Math.round(total / 1e3)).padStart(2, "0");
    pop.appendChild(badge);
    const bar = document.createElement("span");
    bar.className = "progress";
    pop.appendChild(bar);
    let elapsed = 0, last = null, held = false, step = -1, playing = false;
    const fills = durations.map((_, k) => {
        const s = document.createElement("span"), b = document.createElement("b"), i = document.createElement("i");
        b.appendChild(i);
        s.appendChild(b);
        bar.appendChild(s);
        s.addEventListener("click", e => {
            e.stopPropagation();
            elapsed = durations.slice(0, k).reduce((a, x) => a + x, 0);
            step = -1;
        });
        return i;
    });
    const has = (el, name, i) => (el.dataset[name] || "").split(" ").includes(String(i));
    function show(i) {
        step = i;
        parts.forEach(p => p.classList.toggle("on", has(p, "on", i)));
        toned.forEach(el => {
            el.classList.toggle("hot", has(el, "hot", i));
            el.classList.toggle("good", has(el, "good", i));
        });
        movers.forEach((el, n) => {
            let value = moves[n][0][1];
            for (const [from, v] of moves[n]) if (from <= i) value = v;
            el.style.transform = value;
        });
    }
    function stepAt(ms) {
        let t = 0;
        for (let i = 0; i < durations.length; i++) {
            t += durations[i];
            if (ms < t) return i;
        }
        return durations.length - 1;
    }
    function frame(now) {
        if (!playing) return;
        if (last !== null && !held) elapsed = (elapsed + now - last) % total;
        last = now;
        const i = stepAt(elapsed);
        if (i !== step) show(i);
        let start = 0;
        fills.forEach((f, k) => {
            f.style.transform = `scaleX(${Math.min(1, Math.max(0, (elapsed - start) / durations[k]))})`;
            start += durations[k];
        });
        requestAnimationFrame(frame);
    }
    function still() {
        playing = false;
        pop.classList.remove("playing");
        pop.classList.add("still");
        show(poster);
        requestAnimationFrame(() => pop.classList.remove("still"));
    }
    function play() {
        if (playing) return;
        playing = true;
        elapsed = 0;
        last = null;
        step = -1;
        pop.classList.add("playing");
        requestAnimationFrame(frame);
    }
    pop.addEventListener("click", e => e.stopPropagation());
    still();
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduced) {
        pop.addEventListener("motion:play", play);
        pop.addEventListener("motion:still", still);
    }
    if (inModal) {
        if (!reduced) play();
    } else {
        let pressedAt = 0;
        pop.addEventListener("pointerdown", () => {
            pressedAt = performance.now();
        });
        pop.addEventListener("click", () => {
            if (performance.now() - pressedAt < 300) openMotionModal(pop.dataset.motion);
        });
        if (!reduced && matchMedia("(hover: hover)").matches) {
            pop.addEventListener("mouseenter", play);
            pop.addEventListener("mouseleave", still);
        }
    }
    if (reduced) return;
    svg.addEventListener("pointerdown", () => {
        held = true;
    });
    for (const name of [ "pointerup", "pointerleave", "pointercancel" ]) svg.addEventListener(name, () => {
        held = false;
    });
    svg.addEventListener("contextmenu", e => e.preventDefault());
}

async function sharePractice(id) {

}

function wrapCanvasText(context, value, maxWidth) {
    const lines = [];
    let line = "";
    for (const word of value.split(" ")) {
        const candidate = line ? line + " " + word : word;
        if (context.measureText(candidate).width > maxWidth && line) {
            lines.push(line);
            line = word;
        } else line = candidate;
    }
    if (line) lines.push(line);
    return lines;
}

function drawTierImage(categoryId) {

    const answers = allAnswers().filter(a => !categoryId || a.category === categoryId);
    const sectionTitle = categoryId ? surveySections().find(c => c.id === categoryId)?.title : "";
    const width = 1200, padding = 32, labelWidth = 190, tileWidth = 158, tileHeight = 70, gap = 8, scale = 2;
    const perRow = Math.floor((width - padding * 2 - labelWidth - gap) / (tileWidth + gap));
    const rows = ANSWER_IDS.map((id, i) => ({
        i: i,
        titles: answers.filter(a => a.answer === i).map(a => byEntry[a.entry]).filter(Boolean).map(e => text(e.title).value)
    }));
    const heights = rows.map(r => Math.max(1, Math.ceil(r.titles.length / perRow)) * (tileHeight + gap) + gap);
    const headerHeight = 96, footerHeight = 64;
    const height = headerHeight + heights.reduce((a, b) => a + b, 0) + (rows.length - 1) * 4 + footerHeight;
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;
    const context = canvas.getContext("2d");
    context.scale(scale, scale);
    context.fillStyle = "#151515";
    context.fillRect(0, 0, width, height);
    context.fillStyle = "#f4f1ea";
    context.font = "700 30px ui-monospace, Menlo, monospace";
    context.fillText(ui.imageTitle, padding, 52);
    if (sectionTitle) {
        context.fillStyle = "#9a9a9a";
        context.font = "500 20px ui-monospace, Menlo, monospace";
        context.fillText("# " + sectionTitle.toLowerCase(), padding, 82);
    }
    let y = headerHeight;
    rows.forEach((row, index) => {
        const rowHeight = heights[index];
        context.fillStyle = ANSWER_COLORS[row.i];
        context.fillRect(padding, y, labelWidth, rowHeight);
        context.fillStyle = "#111";
        context.font = "800 34px ui-monospace, Menlo, monospace";
        context.fillText(TIER_LETTERS[row.i], padding + 14, y + 42);
        context.font = "600 16px system-ui, sans-serif";
        wrapCanvasText(context, tierLabel(row.i), labelWidth - 28).forEach((line, k) => context.fillText(line, padding + 14, y + 66 + k * 19));
        context.fillStyle = "#262626";
        context.fillRect(padding + labelWidth, y, width - padding * 2 - labelWidth, rowHeight);
        row.titles.forEach((title, k) => {
            const x = padding + labelWidth + gap + k % perRow * (tileWidth + gap), tileY = y + gap + Math.floor(k / perRow) * (tileHeight + gap);
            context.fillStyle = "#f4f1ea";
            context.beginPath();
            context.roundRect(x, tileY, tileWidth, tileHeight, 4);
            context.fill();
            context.fillStyle = "#111";
            context.font = "600 15px system-ui, sans-serif";
            wrapCanvasText(context, title, tileWidth - 16).slice(0, 3).forEach((line, n) => context.fillText(line, x + 8, tileY + 22 + n * 18));
        });
        y += rowHeight + 4;
    });
    context.fillStyle = "#9a9a9a";
    context.font = "500 18px ui-monospace, Menlo, monospace";
    context.fillText(`${ui.makeYours} ${data.meta.siteUrl.replace(/^https?:\/\//, "").replace(/\/$/, "")}`, padding, height - 26);
    return canvas;
}

const flyBall = (color, size) => {
    const b = document.createElement("div");
    b.className = "fly-ball";
    Object.assign(b.style, {
        background: color,
        width: `${size}px`,
        height: `${size}px`
    });
    return document.body.appendChild(b);
};

const flyAt = (x, y, size, extra = "") => `translate(${x - size / 2}px, ${y - size / 2}px) ${extra}`;

const FLIGHTS = {
    async arc(f, t, color, basket) {
        const b = flyBall(color, 22), peak = Math.min(f.y, t.y) - 60;
        const frames = Array.from({
            length: 21
        }, (_, k) => {
            const q = k / 20, y = (1 - q) ** 2 * f.y + 2 * (1 - q) * q * peak + q * q * t.y;
            return {
                transform: flyAt(f.x + (t.x - f.x) * q, y, 22, `scale(${1 - .55 * q})`)
            };
        });
        await b.animate(frames, {
            duration: 620,
            easing: "cubic-bezier(.45,.05,.55,.95)"
        }).finished;
        b.remove();
        basket.animate([ {
            transform: "scale(1)"
        }, {
            transform: "scale(.9)"
        }, {
            transform: "scale(1.06)"
        }, {
            transform: "scale(1)"
        } ], {
            duration: 380,
            easing: "ease-out"
        });
    },
    async drop(f, t, color, basket) {
        const b = flyBall(color, 22);
        await b.animate([ {
            transform: flyAt(f.x, f.y, 22)
        }, {
            transform: flyAt(f.x, f.y - 26, 22)
        } ], {
            duration: 170,
            easing: "cubic-bezier(.2,.7,.4,1)"
        }).finished;
        await b.animate([ {
            transform: flyAt(f.x, f.y - 26, 22)
        }, {
            transform: flyAt(t.x, t.y, 22, "scale(.5)")
        } ], {
            duration: 480,
            easing: "cubic-bezier(.55,0,1,.45)"
        }).finished;
        b.remove();
        basket.animate([ {
            transform: "translateY(0) scaleY(1)"
        }, {
            transform: "translateY(3px) scaleY(.88)"
        }, {
            transform: "translateY(-2px) scaleY(1.04)"
        }, {
            transform: "none"
        } ], {
            duration: 420,
            easing: "ease-out"
        });
    },
    async comet(f, t, color, basket) {
        const duration = 380, easing = "cubic-bezier(.6,0,.3,1)";
        for (let i = 1; i <= 5; i++) {
            const size = 16 - i * 2, d = flyBall(color, size);
            d.style.opacity = .5 - i * .08;
            d.animate([ {
                transform: flyAt(f.x, f.y, size)
            }, {
                transform: flyAt(t.x, t.y, size)
            } ], {
                duration: duration,
                delay: i * 28,
                easing: easing,
                fill: "backwards"
            }).finished.then(() => d.remove());
        }
        const b = flyBall(color, 16);
        await b.animate([ {
            transform: flyAt(f.x, f.y, 16)
        }, {
            transform: flyAt(t.x, t.y, 16)
        } ], {
            duration: duration,
            easing: easing
        }).finished;
        b.remove();
        basket.animate([ {
            boxShadow: `0 0 0 0 ${color}`
        }, {
            boxShadow: "0 0 0 9px transparent"
        } ], {
            duration: 500,
            easing: "ease-out"
        });
    },
    async drip(f, t, color, basket) {
        const b = flyBall(color, 22), angle = Math.atan2(t.y - f.y, t.x - f.x) * 180 / Math.PI;
        await b.animate([ {
            transform: flyAt(f.x, f.y, 22, `rotate(${angle}deg)`)
        }, {
            transform: flyAt((f.x + t.x) / 2, (f.y + t.y) / 2, 22, `rotate(${angle}deg) scale(1.6, .7)`),
            offset: .5
        }, {
            transform: flyAt(t.x, t.y, 22, `rotate(${angle}deg) scale(.6)`)
        } ], {
            duration: 560,
            easing: "cubic-bezier(.5,0,.5,1)"
        }).finished;
        b.remove();
        basket.animate([ {
            backgroundColor: color
        }, {
            backgroundColor: getComputedStyle(basket).backgroundColor
        } ], {
            duration: 600,
            easing: "ease-out"
        });
    }
};

function flyToBasket(from, color, answer) {
    const bar = document.getElementById("surveyBar"), basket = bar.querySelector(`.tier-chip[data-answer="${answer}"]`) || bar.querySelector("button");
    if (bar.hidden || !basket || matchMedia("(prefers-reduced-motion: reduce)").matches || !Element.prototype.animate) return;
    const to = basket.getBoundingClientRect(), names = Object.keys(FLIGHTS);
    FLIGHTS[names[Math.floor(Math.random() * names.length)]]({
        x: from.left + from.width / 2,
        y: from.top + from.height / 2
    }, {
        x: to.left + to.width / 2,
        y: to.top + to.height / 2
    }, color, basket);
}

let motionObserver = null, playingScheme = null;

function watchSchemes() {
    motionObserver?.disconnect();
    if (!matchMedia("(hover: none)").matches || !("IntersectionObserver" in window)) return;
    const ratios = new Map;
    motionObserver = new IntersectionObserver(items => {
        items.forEach(item => ratios.set(item.target, item.intersectionRatio));
        const middle = innerHeight / 2, distance = pop => {
            const r = pop.getBoundingClientRect();
            return Math.abs((r.top + r.bottom) / 2 - middle);
        };
        let best = null, bestRatio = .6;
        ratios.forEach((ratio, pop) => {
            if (ratio > bestRatio || ratio === bestRatio && ratio >= .6 && (!best || distance(pop) < distance(best))) {
                best = pop;
                bestRatio = ratio;
            }
        });
        if (best === playingScheme) return;
        playingScheme?.dispatchEvent(new Event("motion:still"));
        best?.dispatchEvent(new Event("motion:play"));
        playingScheme = best;
    }, {
        threshold: [ 0, .25, .5, .6, .75, .9, 1 ]
    });
    document.querySelectorAll("#content .mfig[data-motion]").forEach(pop => motionObserver.observe(pop));
}

let answersObserver = null;

function blocks() {

function renderToc() {

INTRO.en = `\n  <p>Opus 4.5 came out on 24 November 2025. Back then I kept a list of tips for coding with LLMs, and most of it was about writing prompts and preparing context. A year of agent work later I rarely do either, and I wouldn’t follow a lot of that list myself: the models read a vague prompt well enough now, and shouting ALWAYS and NEVER at an agent buys far less than it did.</p>\n  <p>What went the other way, to my surprise, is everything that predates LLMs. <a href="#stage-test-qa">Tests</a>, <a href="#group-team-review">code review</a> and <a href="#agent-readable-test-output">CI</a> all count for more now that an agent writes code faster than anyone can read it, and several of the practices on this page grew straight out of them. Even the rubber duck survived; now it just happens to talk back.</p>`;

INTRO.ru = `\n  <p>В 2025 году я вёл список советов по программированию с LLM. Через год многим из них я бы и сам не следовал: большая часть была про то, как писать промпты и готовить контекст, а с современными моделями вроде Opus 5.5 я почти не делаю ни того, ни другого. Поэтому я собрал список заново, из практического опыта: что пишут о своей работе люди, которые делают софт с агентами.</p>\n  <p>Промпты стали менее важны. С практиками, которые существовали задолго до LLM, вышло наоборот: я не нашёл никого, кто отказался бы от <a href="#stage-test-qa">тестов</a>, <a href="#group-team-review">код-ревью</a> или <a href="#agent-readable-test-output">CI</a>. Несколько практик здесь выросли из них. <a href="#test-driven-development-ai">Тесты до кода агента</a>, например, это разработка через тестирование (2002), только код пишет агент. Даже резиновая уточка осталась, просто теперь она отвечает.</p>`;

INTRO.zh = `\n<p>2025 年我整理过一份用 LLM 写代码的小技巧清单。一年之后，其中很多我自己都不会再照做了：大部分讲的是怎么写提示词、怎么准备上下文，而用 Opus 5.5 这样的新模型，这两件事我几乎不做了。所以我根据实际经验重做了这份清单：来自用 agent 构建软件的人，写的是他们自己的工作。</p>\n  <p>提示词的重要性下降了。而早在 LLM 出现之前就有的那些实践，走向了相反的方向：我没找到有谁收回对<a href="#stage-test-qa">测试</a>、<a href="#group-team-review">代码评审</a>或 <a href="#agent-readable-test-output">CI</a> 的看法。这里的好几个实践都是从它们长出来的。比如<a href="#test-driven-development-ai">先写测试再让 agent 写代码</a>，就是测试驱动开发（2002）加上由 agent 来写代码。连小黄鸭也还在；只不过现在它会回话了。</p>`;

INTRO.es = `\n<p>En 2025 llevé una lista de consejos para programar con LLMs. Un año después yo mismo no seguiría gran parte de ella: casi todo trataba de escribir prompts y preparar el contexto, y con modelos actuales como Opus 5.5 rara vez hago ninguna de las dos cosas. Así que rehice la lista a partir de la experiencia práctica: de personas que construyen software con agentes y escriben sobre su propio trabajo.</p>\n  <p>Escribir prompts es lo que perdió importancia. Las prácticas que existían mucho antes de los LLMs fueron en sentido contrario: no encontré a nadie que renunciara a los <a href="#stage-test-qa">tests</a>, a la <a href="#group-team-review">revisión de código</a> o a la <a href="#agent-readable-test-output">CI</a>. Varias prácticas de aquí nacieron de ellas. <a href="#test-driven-development-ai">Los tests antes del código del agente</a>, por ejemplo, son el desarrollo guiado por tests (2002) con un agente escribiendo el código. Hasta el patito de goma sigue aquí; solo que ahora responde.</p>`;

INTRO.pt = `\n<p>Em 2025 eu mantinha uma lista de dicas para programar com LLMs. Um ano depois, eu mesmo não seguiria boa parte dela: quase tudo era sobre escrever prompts e preparar contexto, e com modelos atuais como o Opus 5.5 eu raramente faço uma coisa ou outra. Então refiz a lista a partir da experiência prática: de pessoas que constroem software com agentes e escrevem sobre o próprio trabalho.</p>\n  <p>Escrever prompts foi a parte que perdeu importância. As práticas que existiam muito antes dos LLMs foram na direção oposta: não encontrei ninguém voltando atrás em relação a <a href="#stage-test-qa">testes</a>, <a href="#group-team-review">code review</a> ou <a href="#agent-readable-test-output">CI</a>. Várias práticas daqui nasceram delas. <a href="#test-driven-development-ai">Testes antes do código do agente</a>, por exemplo, é o desenvolvimento orientado a testes (2002) com um agente escrevendo o código. Até o patinho de borracha continua por aqui; só que agora ele responde.</p>`;

INTRO.ja = `\n<p>2025年に、LLM でコーディングするためのコツの一覧を作っていました。1年たった今、その多くは自分でも守らないでしょう。大半はプロンプトの書き方とコンテキストの準備についてで、Opus 5.5 のような今のモデルでは、どちらもほとんどしないからです。そこで、一覧を実体験から作り直しました。エージェントでソフトウェアを作っている人たちが、自分の仕事について書いたものです。</p>\n  <p>重要度が下がったのは、プロンプトの部分です。LLM よりずっと前からあった実践は、逆の方向に進みました。<a href="#stage-test-qa">テスト</a>、<a href="#group-team-review">コードレビュー</a>、<a href="#agent-readable-test-output">CI</a> を撤回している人は、見つけられませんでした。ここにある実践のいくつかは、それらから育ったものです。たとえば<a href="#test-driven-development-ai">エージェントのコードより先にテスト</a>は、エージェントがコードを書くテスト駆動開発(2002年)です。ラバーダックも健在です。ただ今は、アヒルが返事をしてくれます。</p>`;

function formatUpdated(day) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day || "")) return "";
    const [y, m, d] = day.split("-").map(Number);
    const locale = (LANGS.find(l => l.code === lang) || {}).html || lang;
    return new Intl.DateTimeFormat(lang === "en" ? "en-GB" : locale, {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
    }).format(new Date(Date.UTC(y, m - 1, d)));
}

const question = document.getElementById("question");

let questionEntryId = null, hideTimer = null, activeEntryId = null;

const isTouch = matchMedia("(hover: none)").matches;

function leftLimit() {
    const toc = document.getElementById("toc");
    return getComputedStyle(toc).position === "fixed" ? toc.getBoundingClientRect().right + 8 : 8;
}

function showQuestion(entryElement) {
    clearTimeout(hideTimer);
    questionEntryId = entryElement.dataset.entry;
    const ui = UI[lang], mine = myAnswers[questionEntryId], q = data.meta.usefulQuestion;
    const counts = answerCounts(questionEntryId), total = counts.yes + counts.no;
    const enough = total >= data.meta.minAnswersForBar;
    question.innerHTML = `<span class="ask">${q[lang]}</span>\n    <div class="buttons"><button class="yes ${mine?.useful === true ? "chosen" : ""}" data-answer="yes">${ui.yes}</button><button class="no ${mine?.useful === false ? "chosen" : ""}" data-answer="no">${ui.no}</button><button class="never ${mine && mine.useful === null ? "chosen" : ""}" data-answer="never">${ui.never}</button></div>\n    `;
    question.style.display = "block";
    question.className = "";
    const rect = entryElement.getBoundingClientRect(), gap = 12;
    const bottomLimit = innerHeight - 8;
    let left, top = rect.top;
    if (rect.left - question.offsetWidth - gap >= leftLimit()) {
        question.classList.add("left");
        left = rect.left - question.offsetWidth - gap;
    } else if (rect.right + question.offsetWidth + gap <= innerWidth - 8) {
        question.classList.add("right");
        left = rect.right + gap;
    } else {
        question.classList.add("below");
        left = Math.max(8, rect.left);
        top = rect.bottom + gap;
    }
    top = Math.max(8, Math.min(top, bottomLimit - question.offsetHeight));
    question.style.left = left + scrollX + "px";
    question.style.top = top + scrollY + "px";
}

function hideQuestion() {
    if (question.contains(document.activeElement)) return;
    question.style.display = "none";
    questionEntryId = null;
}

function markActive(entryId, scroll) {
    document.querySelectorAll(".entry.active").forEach(e => e.classList.remove("active"));
    activeEntryId = entryId;
    const element = document.querySelector(`.entry[data-entry="${entryId}"]`);
    if (!element) return null;
    element.classList.add("active");
    if (scroll) element.scrollIntoView({
        block: "center"
    });
    return element;
}

function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideQuestion, 250);
}

document.addEventListener("mouseover", e => {
    if (isTouch) return;
    if (e.target.matches("sup button")) {
        clearTimeout(popoverTimer);
        popoverTimer = null;
        if (popover?.dataset.for !== footnoteKey(e.target)) openPopover(e.target);
    } else if (e.target.matches("a.ref[data-root]")) {
        clearTimeout(popoverTimer);
        popoverTimer = null;
        if (popover?.dataset.for !== "root:" + e.target.dataset.root) {
            openRootPopover(e.target);
            popover.dataset.for = "root:" + e.target.dataset.root;
        }
    } else if (popover && !popoverPinned) {
        if (popover.contains(e.target)) {
            clearTimeout(popoverTimer);
            popoverTimer = null;
        } else if (!popoverTimer) popoverTimer = setTimeout(closePopover, 200);
    }
    const entryElement = e.target.closest(".entry");
    if (entryElement) {
        if (entryElement.classList.contains("askable") && entryElement.dataset.entry !== questionEntryId) showQuestion(entryElement); else if (entryElement.classList.contains("askable")) clearTimeout(hideTimer); else if (questionEntryId) scheduleHide();
    } else if (question.contains(e.target)) clearTimeout(hideTimer); else if (questionEntryId) scheduleHide();
});

function answer(useful) {
    if (!questionEntryId) return;
    myAnswers[questionEntryId] = {
        useful: useful,
        answeredAt: today.toISOString().slice(0, 10)
    };
    saveAnswers();
    const entryId = questionEntryId;
    render();
    const entryElement = document.querySelector(`.entry[data-entry="${entryId}"]`);
    if (entryElement) showQuestion(entryElement);
}

question.addEventListener("click", e => {
    const button = e.target.closest("[data-answer]");
    if (button) answer({
        yes: true,
        no: false,
        never: null
    }[button.dataset.answer]);
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        closePopover();
        question.querySelector("textarea")?.blur();
        hideQuestion();
        return;
    }
    if (e.target.closest?.("textarea, input") || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === "j" || key === "k") {
        const cards = [ ...document.querySelectorAll("#content .entry") ];
        if (!cards.length) return;
        const index = cards.findIndex(c => c.classList.contains("active"));
        const next = cards[index === -1 ? 0 : Math.max(0, Math.min(cards.length - 1, index + (key === "j" ? 1 : -1)))];
        document.querySelectorAll(".entry.active").forEach(c => c.classList.remove("active"));
        next.classList.add("active");
        activeEntryId = next.dataset.entry;
        next.scrollIntoView({
            block: "center"
        });
        if (next.classList.contains("askable")) requestAnimationFrame(() => showQuestion(next)); else {
            question.style.display = "none";
            questionEntryId = null;
        }
        e.preventDefault();
    }
    if ((key === "y" || key === "n") && questionEntryId) {
        answer(key === "y");
        e.preventDefault();
    }
});

let popover = null, popoverPinned = false, popoverTimer = null;

function closePopover() {
    clearTimeout(popoverTimer);
    popoverTimer = null;
    popoverPinned = false;
    popover?.remove();
    popover = null;
}

function footnoteKey(button) {
    return `${button.dataset.entry || "intro"}:${button.dataset.n ?? button.dataset.intro}`;
}

function sourceLine(source) {
    const title = source.work ? `<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener">«${escapeHtml(source.work)}»</a>` : `<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener">${escapeHtml(new URL(source.url).hostname.replace(/^www\./, ""))}</a>`;
    return [ source.author && escapeHtml(source.author), title, source.published && escapeHtml(source.published) ].filter(Boolean).join(", ");
}

function openRootPopover(link) {
    closePopover();
    const ui = UI[lang];
    const root = data.entries.find(e => e.id === link.dataset.root);
    if (!root) return;
    const quoted = root.sources.filter(s => s.quote);
    const source = quoted.find(s => s.role === "relevance") || quoted[0];
    const date = root.firstAppeared?.verified ? entryDate(root) : null;
    popover = document.createElement("div");
    popover.className = "popover";
    const heading = `<b>${escapeHtml(text(root.title).value)}</b>${date ? ` · ${date.getFullYear()}` : ""}<br>`;
    const definition = `<span class="root-definition">${escapeHtml(text(root.definition).value.replace(/(\s*\[\d+\])+\s*$/, ""))}</span><br>`;
    const body = source ? `<q>${escapeHtml(source.quote)}</q><span class="who">${sourceLine(source)}</span>` : "";
    popover.innerHTML = heading + definition + body;
    document.body.appendChild(popover);
    const rect = link.getBoundingClientRect();
    popover.style.left = Math.max(8, Math.min(rect.left + scrollX, scrollX + innerWidth - popover.offsetWidth - 8)) + "px";
    popover.style.top = rect.bottom + scrollY + 4 + "px";
}

function openFigurePopover(link) {
    closePopover();
    popover = document.createElement("div");
    popover.className = "popover figure-popover";
    popover.innerHTML = `<img src="${SITE_ROOT}figures/${link.dataset.figure}.svg" alt="${escapeHtml(figures[link.dataset.figure] || "")}">`;
    document.body.appendChild(popover);
    const rect = link.getBoundingClientRect();
    popover.style.left = Math.max(8, Math.min(rect.left + scrollX, scrollX + innerWidth - popover.offsetWidth - 8)) + "px";
    popover.style.top = rect.bottom + scrollY + 4 + "px";
}

function openPopover(button) {
    closePopover();
    const ui = UI[lang];
    const entry = data.entries.find(e => e.id === button.dataset.entry);
    const numbers = (button.dataset.n || "").split(",");
    const sources = button.dataset.intro !== undefined ? [ INTRO_SOURCES[button.dataset.intro] ] : (entry?.sources || []).filter(s => numbers.includes(String(s.n)));
    if (!sources.length || !sources[0]) return;
    popover = document.createElement("div");
    popover.className = "popover";
    popover.dataset.for = footnoteKey(button);
    popover.innerHTML = sources.map(source => `<div class="pop-item">` + (source.quote ? `<q>${escapeHtml(source.quote)}</q>` : `<span class="no-quote">${ui.noQuote}</span>`) + `<span class="who">${sourceLine(source)}</span></div>`).join("");
    document.body.appendChild(popover);
    const rect = button.getBoundingClientRect();
    popover.style.left = Math.max(8, Math.min(rect.left + scrollX, scrollX + innerWidth - popover.offsetWidth - 8)) + "px";
    popover.style.top = rect.bottom + scrollY + 4 + "px";
}

document.addEventListener("click", e => {
    if (e.target.matches("a.suggest-edit")) {
        e.preventDefault();
        if (popover?.dataset.for === "suggest:" + e.target.closest(".entry").dataset.entry) popoverPinned = true; else openSuggestPopover(e.target);
        return;
    }
    if (e.target.matches("sup button")) {
        if (popover?.dataset.for !== footnoteKey(e.target)) openPopover(e.target);
        popoverPinned = true;
        return;
    }
    if (e.target.matches("a.ref[data-root]")) {
        e.preventDefault();
        openRootPopover(e.target);
        popoverPinned = true;
        return;
    }
    if (e.target.matches("a.ref[data-figure]")) {
        e.preventDefault();
        openFigurePopover(e.target);
        popoverPinned = true;
        return;
    }
    if (!popover?.contains(e.target)) closePopover();
    if (isTouch && !question.contains(e.target)) {
        const entryElement = e.target.closest(".entry");
        if (entryElement && !e.target.closest("a")) {
            markActive(entryElement.dataset.entry, false);
            if (entryElement.classList.contains("askable")) showQuestion(entryElement); else hideQuestion();
        } else hideQuestion();
    }
});

function markTocSection() {
    let current = null;
    const links = [ ...document.querySelectorAll("#toc a.item, #toc a.part.solo") ];
    const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
    for (const link of links) {
        const target = document.getElementById(link.getAttribute("href").slice(1));
        if (target && target.getBoundingClientRect().top <= (atEnd ? innerHeight - 80 : 140)) current = link;
    }
    for (const link of links) link.classList.toggle("active", link === current);
    const toc = document.getElementById("toc");
    if (current && toc.scrollHeight > toc.clientHeight) {
        const top = current.offsetTop, bottom = top + current.offsetHeight;
        if (top < toc.scrollTop + 24 || bottom > toc.scrollTop + toc.clientHeight - 24) toc.scrollTop = top - toc.clientHeight / 2;
    }
}

function onScroll() {
    markTocSection();
    updateBarVisibility();
}

addEventListener("scroll", onScroll, {
    passive: true
});

addEventListener("resize", onScroll);

document.querySelectorAll("input[name=lang]").forEach(input => input.addEventListener("change", () => {
    lang = input.value;
    render();
}));

document.addEventListener("click", e => {
    const link = e.target.closest?.("a[href]");
    if (!link || link.target) return;
    if (new URL(link.href, location.href).origin !== location.origin) {
        link.target = "_blank";
        link.rel = "noopener";
    }
});

function openHash() {
    const [id, action] = decodeURIComponent(location.hash.slice(1)).split("/");
    const entry = data.entries.find(e => e.id === id);
    if (!entry) return;
    const element = markActive(id, true);
    if (action === "play" && element?.querySelector(".mfig[data-motion]") && !document.querySelector(".mfig-modal")) {
        openMotionModal(id, () => history.replaceState(null, "", "#" + id));
        return;
    }
    const scheme = element?.querySelector(".mfig[data-motion]");
    if (!scheme || scheme === playingScheme) return;
    playingScheme?.dispatchEvent(new Event("motion:still"));
    scheme.dispatchEvent(new Event("motion:play"));
    playingScheme = scheme;
    const away = new IntersectionObserver(([item]) => {
        if (item.isIntersecting) return;
        away.disconnect();
        if (playingScheme === scheme) {
            scheme.dispatchEvent(new Event("motion:still"));
            playingScheme = null;
        }
    });
    away.observe(scheme);
}

addEventListener("hashchange", openHash);

document.addEventListener("click", async e => {
    const button = e.target.closest?.('[data-act="copy-text"]');
    if (!button) return;
    const text = button.closest(".copy-block").querySelector("pre").textContent;
    try {
        await navigator.clipboard.writeText(text);
    } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
    }
    selectAll(button.closest(".copy-block").querySelector("pre"));
    button.textContent = UI[lang].survey.copied;
});

const loadData = window.REFERENCE_DATA ? Promise.resolve([ window.REFERENCE_DATA, window.REFERENCE_DEMO_ANSWERS || {
    answers: []
} ]) : Promise.all([ fetch(SITE_ROOT + "entries.json", {
    cache: "no-cache"
}).then(r => r.json()), Promise.resolve({
    answers: []
}) ]);

loadData.catch(() => {
    document.getElementById("content").innerHTML = `<p style="color:#c0392b;font-size:15px">${UI[lang].loadError("https://github.com/inmve/agentic-coding-practices/blob/main/data/entries.json")}</p>`;
});

function applyTranslation(tr) {
    const set = (field, value) => {
        if (field) field[lang] = value || field.en;
    };
    for (const entry of data.entries) {
        const item = tr.entries?.[entry.id] || {};
        set(entry.title, item.title);
        set(entry.definition, item.definition);
        if (item.aliases) (entry.aliases ||= {})[lang] = item.aliases;
        if (entry.origin) set(entry.origin, item.origin);
    }
    for (const stage of data.meta.stages) set(stage.title, tr.stages?.[stage.id]);
    for (const group of [ ...data.meta.groups, ...data.meta.themes || [] ]) {
        const item = (group.entries ? tr.themes : tr.groups)?.[group.id] || {};
        set(group.title, item.title);
        if (group.description) set(group.description, item.description);
    }
    if (data.meta.usefulQuestion?.hint) set(data.meta.usefulQuestion.hint, tr.usefulQuestion?.hint);
}

document.getElementById("langs").addEventListener("click", e => {
    const link = e.target.closest("a[data-dir]");
    if (link && location.hash) link.href = link.dataset.dir + location.hash;
});

const OPUS_45 = new Date("2025-11-24");

let tl = null;

function tlDate(entry) {
    if (entry.seededFrom === "pre-llm") return entry.firstAppeared?.verified ? new Date(entry.firstAppeared.date) : null;
    return entryDate(entry);
}

function buildTimeline() {
    const start = new Date(String(data.meta.timelineStartYear || 1960) + "-01-01"), chatgpt = new Date(data.meta.llmEraStart);
    const bounds = [ start.getTime(), chatgpt.getTime(), OPUS_45.getTime(), today.getTime() ];
    const items = [];
    for (const entry of data.entries) {
        const date = tlDate(entry);
        if (date && date <= today) items.push({
            id: entry.id,
            ms: date.getTime(),
            root: entry.seededFrom === "pre-llm"
        });
    }
    const segments = [ 0, 1, 2 ].map(k => {
        const inside = [ ...new Set(items.map(i => i.ms).filter(ms => ms > bounds[k] && ms < bounds[k + 1])) ].sort((a, b) => a - b);
        return {
            from: bounds[k],
            to: bounds[k + 1],
            knots: [ bounds[k], ...inside, bounds[k + 1] ],
            x0: k / 3
        };
    });
    tl = {
        segments: segments,
        items: items,
        range: [ bounds[0], bounds[3] ]
    };
    drawTimeline();
}

function tlToX(ms) {
    const segment = tl.segments.find(s => ms <= s.to) || tl.segments[2];
    const knots = segment.knots, step = 1 / 3 / (knots.length - 1);
    if (ms <= knots[0]) return segment.x0;
    for (let i = 1; i < knots.length; i++) if (ms <= knots[i]) return segment.x0 + step * (i - 1 + (ms - knots[i - 1]) / (knots[i] - knots[i - 1]));
    return 1;
}

function tlFromX(x) {
    x = Math.min(1, Math.max(0, x));
    const segment = tl.segments[Math.min(2, Math.floor(x * 3))], knots = segment.knots, step = 1 / 3 / (knots.length - 1);
    const position = (x - segment.x0) / step, i = Math.min(knots.length - 2, Math.floor(position));
    return knots[i] + (knots[i + 1] - knots[i]) * (position - i);
}

function tlLabel(ms) {
    const date = new Date(ms);
    return ms < tl.segments[0].to ? String(date.getFullYear()) : `${UI[lang].months[date.getMonth()]} ${date.getFullYear()}`;
}

function tlFull() {
    return tl.range[0] <= tl.segments[0].from && tl.range[1] >= tl.segments[2].to;
}

function drawTimeline() {
    if (!tl) return;
    const track = document.getElementById("tlTrack"), width = track.clientWidth || 700;
    let html = tl.segments.map((s, k) => `<div class="zone ${[ "history", "llm", "recent" ][k]}" style="left:${s.x0 * 100}%;width:${100 / 3}%"></div>`).join("");
    html += tl.items.map(i => `<div class="tick ${i.root ? "root" : "card"}" data-ms="${i.ms}" style="left:${tlToX(i.ms) * 100}%"></div>`).join("");
    let lastX = -1;
    for (const year of [ 1970, 1980, 1990, 2e3, 2010, 2023, 2024, 2025, 2026 ]) {
        const x = tlToX(new Date(`${year}-01-01`).getTime());
        if (x <= .005 || x >= .995 || (x - lastX) * width < 34) continue;
        html += `<div class="axis" style="left:${x * 100}%">${year}</div>`;
        lastX = x;
    }
    html += `<span class="end-year start">${new Date(tl.segments[0].from).getFullYear()}</span><span class="end-year end">${today.getFullYear()}</span>`;
    html += `<div class="mark" style="left:${100 / 3}%"><span>ChatGPT</span></div><div class="mark" style="left:${200 / 3}%"><span>Opus 4.5</span></div>`;
    html += `<div class="shade" id="tlShadeL"></div><div class="shade" id="tlShadeR"></div>` + `<div class="sel" id="tlSel" data-drag="move"><div class="handle start" data-drag="start"></div><div class="handle end" data-drag="end"></div></div>`;
    track.innerHTML = html;
    placePeriod();
}

function placePeriod() {
    const left = tlToX(tl.range[0]) * 100, right = tlToX(tl.range[1]) * 100, full = tlFull();
    const sel = document.getElementById("tlSel");
    sel.style.left = left + "%";
    sel.style.width = right - left + "%";
    sel.classList.toggle("full", full);
    document.getElementById("tlShadeL").style.cssText = `left:0;width:${full ? 0 : left}%`;
    document.getElementById("tlShadeR").style.cssText = `left:${right}%;width:${full ? 0 : 100 - right}%`;
    paintPeriod();
}

function paintPeriod() {
    if (!tl) return;
    const [from, to] = tl.range, full = tlFull(), ui = UI[lang];
    const inRange = ms => ms !== null && ms >= from && ms <= to;
    const byId = Object.fromEntries(tl.items.map(i => [ i.id, i.ms ]));
    const lit = new Set;
    if (!full) for (const entry of data.entries) {
        if (inRange(byId[entry.id] ?? null) || (entry.rootsIn || []).some(r => inRange(byId[r] ?? null))) lit.add(entry.id);
    }
    document.querySelectorAll(".entry[data-entry], td.name[data-entry]").forEach(el => el.classList.toggle("in-period", lit.has(el.dataset.entry)));
    document.querySelectorAll("#tlTrack .tick").forEach(t => t.classList.toggle("on", !full && inRange(Number(t.dataset.ms))));
    document.body.classList.toggle("tl-picked", !full);
    document.getElementById("tlCaption").innerHTML = full ? "" : `<span>${ui.tlCount(lit.size, tlLabel(from), to >= tl.segments[2].to - 864e5 ? ui.tlToday : tlLabel(to))}</span><button class="reset" data-act="tl-reset">${ui.tlReset}</button>`;
}

(() => {
    const track = document.getElementById("tlTrack");
    let drag = null, pressX = null;
    const fraction = clientX => {
        const r = track.getBoundingClientRect();
        return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    };
    track.addEventListener("pointerdown", e => {
        if (!tl) return;
        pressX = e.clientX;
        const mode = e.target.dataset.drag;
        if (!mode || mode === "move" && tlFull()) return;
        drag = {
            mode: mode,
            x: fraction(e.clientX),
            left: tlToX(tl.range[0]),
            right: tlToX(tl.range[1])
        };
        try {
            track.setPointerCapture(e.pointerId);
        } catch (err) {}
    });
    track.addEventListener("pointermove", e => {
        if (!drag && tl && e.pointerType !== "touch") {
            const k = Math.min(2, Math.floor(fraction(e.clientX) * 3));
            track.querySelectorAll(".zone").forEach((z, i) => z.classList.toggle("hover", i === k));
        }
        if (!drag) return;
        const x = fraction(e.clientX), gap = .01;
        let {left: left, right: right} = drag;
        if (drag.mode === "start") left = Math.min(x, right - gap);
        if (drag.mode === "end") right = Math.max(x, left + gap);
        if (drag.mode === "move") {
            const shift = Math.min(1 - drag.right, Math.max(-drag.left, x - drag.x));
            left += shift;
            right += shift;
        }
        tl.range = [ tlFromX(left), tlFromX(right) ];
        placePeriod();
    });
    track.addEventListener("pointerleave", () => track.querySelectorAll(".zone.hover").forEach(z => z.classList.remove("hover")));
    track.addEventListener("pointerup", e => {
        const click = pressX !== null && Math.abs(e.clientX - pressX) < 3 && e.target.dataset.drag !== "start" && e.target.dataset.drag !== "end";
        drag = null;
        pressX = null;
        if (!click || !tl) return;
        const segment = tl.segments[Math.min(2, Math.floor(fraction(e.clientX) * 3))];
        tl.range = tl.range[0] === segment.from && tl.range[1] === segment.to ? [ tl.segments[0].from, tl.segments[2].to ] : [ segment.from, segment.to ];
        placePeriod();
    });
    document.addEventListener("click", e => {
        if (!e.target.closest?.('[data-act="tl-reset"]') || !tl) return;
        tl.range = [ tl.segments[0].from, tl.segments[2].to ];
        placePeriod();
    });
    const home = document.getElementById("tlHome"), timeline = document.getElementById("timeline");
    new IntersectionObserver(([item]) => {
        const stuck = !item.isIntersecting && item.boundingClientRect.top < 0;
        if (stuck === timeline.classList.contains("stuck")) return;
        home.style.minHeight = stuck ? home.offsetHeight + "px" : "";
        timeline.classList.toggle("stuck", stuck);
        document.body.classList.toggle("tl-stuck", stuck);
        alignStrip();
        drawTimeline();
    }).observe(home);
    function alignStrip() {
        const frame = document.getElementById("content");
        if (!frame) return;
        const rect = frame.getBoundingClientRect(), handle = 7;
        timeline.style.setProperty("--tl-left", rect.left + handle + "px");
        timeline.style.setProperty("--tl-width", rect.width - 2 * handle + "px");
        timeline.classList.toggle("tight", rect.left + handle < 4 * 6.7 + 10 + 2);
    }
    addEventListener("resize", () => {
        alignStrip();
        drawTimeline();
    });
})();

(() => {
    const button = document.getElementById("tocButton"), sheet = document.getElementById("tocSheet");
    const show = open => {
        sheet.hidden = !open;
        button.setAttribute("aria-expanded", String(open));
        button.classList.toggle("open", open);
    };
    button.addEventListener("click", () => show(sheet.hidden));
    sheet.addEventListener("click", e => {
        if (e.target === sheet || e.target.closest("a")) show(false);
    });
    addEventListener("keydown", e => {
        if (e.key === "Escape" && !sheet.hidden) show(false);
    });
})();

loadData.then(async ([json, demo]) => {
    data = json;
    if (![ "en", "ru" ].includes(lang)) {
        const translation = await fetch(SITE_ROOT + `i18n/${lang}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
        if (translation) applyTranslation(translation);
    }
    team = location.href.startsWith(ORIGINAL_SITE) ? null : await fetch("team.json", {
        cache: "no-cache"
    }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (team && typeof team === "object") applyTeam(team); else team = null;
    motion = await fetch(SITE_ROOT + "figures/motion.json").then(r => r.json()).catch(() => ({}));
    figures = await fetch(SITE_ROOT + "figures/index.json").then(r => r.json()).catch(() => ({}));
    demoAnswers = demo.answers;
    for (const entry of data.entries) for (const rootId of entry.rootsIn || []) (descendantsById[rootId] ||= []).push(entry.id);
    render();
    buildTimeline();
    openHash();
})</script>
